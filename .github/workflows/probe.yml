name: probe (run this first)

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to check"
        required: true
        default: perps
        type: choice
        options: [perps, tokens, pools]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check settings
        run: python -m harness.probe ${{ inputs.what }}
